# Data splitting configuration
split_data:
  # Input/Output paths
  input_path: "./PPG_data/MAD/processed_df_resampled/processed_MAD_testDataset_resampled.pkl"
  output_dir: "./PPG_data/MAD/splitted_data_resampled/all_segmentl_normalized/"
  
  # Target labels to select (after merging PAC/PVC into ECT)
  target_labels: ['NORM', 'ECT']
  
  # Label encoding mapping
  label_mapping:
    NORM: 0
    ECT: 1
  
  # Split proportions (must sum to 1.0)
  train_prop: 0.0
  val_prop: 0.0
  test_prop: 1.0

